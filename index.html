<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#0A0C0B;--g:rgba(255,255,255,.065);--gl:rgba(255,255,255,.1);--ink:#F2F5F0;--mute:#8E9A92;--lime:#C6FF3D;--org:#FF6A1F;--sky:#59C8FF;--r:28px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 420px at 85% -5%,rgba(198,255,61,.14),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(255,106,31,.1),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:400 16px/1.45 Outfit,system-ui,sans-serif;padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
main{max-width:620px;margin:0 auto;padding:22px 18px}
h1{font-size:34px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:21px;font-weight:600;margin:30px 0 12px}h3{font-size:18px;font-weight:600;margin:0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--g);border:1px solid var(--gl);border-radius:var(--r);padding:20px;margin:14px 0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:600 15px Outfit,sans-serif;padding:12px 20px;border-radius:99px;border:1px solid var(--gl);background:var(--g);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,background .2s}
button:active{transform:scale(.95)}
button.pri{background:var(--lime);color:#0A0C0B;border-color:var(--lime);box-shadow:0 8px 26px rgba(198,255,61,.3)}
button.ic{width:44px;height:44px;padding:0;justify-content:center}
button.ic.pri{width:48px;height:48px}
button.on{background:var(--lime);color:#0A0C0B;border-color:var(--lime)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input,select{font:inherit;padding:12px 14px;border:1px solid var(--gl);border-radius:16px;background:rgba(255,255,255,.05);color:var(--ink);min-width:0;width:100%}
select option{background:#151917}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);flex:1;min-width:84px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-weight:600;font-size:14px}
.bt{background:rgba(255,106,31,.16);color:var(--org)}.br{background:rgba(89,200,255,.15);color:var(--sky)}
.ring{position:relative;display:grid;place-items:center}.ring svg{position:absolute;inset:0}
.ring .in{position:relative;text-align:center;line-height:1.1}
.arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.macros div{text-align:center}.macros b{font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{padding:9px 16px}
.plan{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.plan .ico{width:48px;height:48px;border-radius:16px;background:rgba(198,255,61,.14);color:var(--lime);display:grid;place-items:center;flex:none}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.sets button{width:54px;height:54px;padding:0;justify-content:center;font-size:20px;font-weight:800;border-radius:50%}
.sets button.d{background:var(--lime);color:#0A0C0B;border-color:var(--lime)}
.sets button.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.ex a{color:var(--sky);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.erow{display:grid;grid-template-columns:1fr 52px 66px 60px 44px;gap:6px;margin:8px 0}.erow input{padding:10px 8px}
.food{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--gl);padding:12px 0}
.food:first-of-type{border-top:0}
.sw{display:flex;gap:8px;align-items:center;border-top:1px solid var(--gl);padding:10px 0}.sw input{width:78px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:flex;gap:4px;padding:8px;border-radius:99px;background:rgba(24,28,26,.72);border:1px solid var(--gl);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:8}
.tabs button{flex:1;flex-direction:column;gap:2px;padding:9px 4px;border:0;background:transparent;color:var(--mute);font-size:11px;border-radius:99px}
.tabs button.on{background:var(--lime);color:#0A0C0B;box-shadow:none}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(116px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:none;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 22px;border-radius:99px;background:var(--org);color:#0A0C0B;z-index:9;box-shadow:0 12px 34px rgba(255,106,31,.4)}
#timer b{font-size:34px;font-weight:800;line-height:1}
#timer button{background:rgba(0,0,0,.18);border-color:transparent;color:#0A0C0B;padding:10px 16px}
.go{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<main id="app"></main>
<div id="flash" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;z-index:20;transition:background .15s"></div>
<div id="timer"><div><div id="tl" style="font-size:13px;font-weight:600">Recupero</div><b id="tv">0:00</b></div><div class="row"><button onclick="tAdd(15)">+15 s</button><button onclick="tStop()">Salta</button></div></div>
<nav class="tabs" aria-label="Sezioni">
<button id="t-home" onclick="setTab('home')"><i data-lucide="layout-dashboard"></i>Oggi</button>
<button id="t-gym" onclick="setTab('gym')"><i data-lucide="dumbbell"></i>Allenamento</button>
<button id="t-food" onclick="setTab('food')"><i data-lucide="utensils"></i>Nutrizione</button>
<button id="t-set" onclick="setTab('set')"><i data-lucide="settings"></i>Impostazioni</button>
</nav>
<script>
const P={Petto:[["Panca piana con bilanciere",4,"8-10",90],["Panca inclinata con manubri",3,"10-12",90],["Croci ai cavi",3,"12-15",60],["Piegamenti",3,"max",60]],
Schiena:[["Lat machine",4,"10-12",90],["Rematore con bilanciere",4,"8-10",90],["Pulley basso",3,"12",60],["Trazioni alla sbarra",3,"max",90]],
Gambe:[["Squat",4,"8-10",120],["Leg press",3,"12",90],["Affondi",3,"10 per gamba",75],["Leg curl",3,"12-15",60],["Calf in piedi",4,"15",45]],
Spalle:[["Military press",4,"8-10",90],["Alzate laterali",4,"12-15",60],["Alzate posteriori",3,"15",60],["Face pull",3,"15",60]],
Braccia:[["Curl con bilanciere",3,"10",60],["Curl a martello",3,"12",60],["French press",3,"10",60],["Pushdown ai cavi",3,"12-15",60]]};
const K="ferrokcal1",D=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
let S={plans:[],days:[1,3,5],ov:{},prof:{sex:"m",age:30,w:75,h:175,act:1.2,goal:"lose"},food:{}};
let stOK=true;try{const r=localStorage.getItem(K);if(r){const o=JSON.parse(r);S=Object.assign(S,o);S.prof=Object.assign({sex:"m",age:30,w:75,h:175,act:1.2,goal:"lose"},o.prof||{})}}catch(e){}
S.steps=S.steps||{};S.hist=S.hist||[];
try{localStorage.setItem(K+"t","1");localStorage.removeItem(K+"t")}catch(e){stOK=false}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){stOK=false}};
const $=i=>document.getElementById(i),td=()=>new Date().toLocaleDateString("sv");
const isTrain=()=>{const t=td();return t in S.ov?S.ov[t]:S.days.includes(new Date().getDay())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I=(n,s=20)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;
let tab="home",view="home",cur=0,sd={},lk="",pend=[],pmsg="",dl=-1,t0=0,res=null;
if(S.sess&&S.plans[S.sess.cur]){cur=S.sess.cur;sd=S.sess.sd||{};t0=S.sess.t0||Date.now();tab="gym";view="session"}

function ring(p,sz,sw,col,inner){const r=(sz-sw)/2,C=2*Math.PI*r,c=sz/2;return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="${sw}"/><circle class="arc" data-o="${C*(1-Math.min(1,Math.max(0,p)))}" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 ${c} ${c})"/></svg><div class="in">${inner}</div></div>`}
function render(anim){
 ["home","gym","food","set"].forEach(t=>$("t-"+t).className=t==tab?"on":"");
 const a=$("app");a.className=anim?"go":"";
 a.innerHTML=tab=="home"?home():tab=="gym"?(view=="session"?session():view=="edit"?editor():view=="done"?summary():view=="lib"?lib():gym()):tab=="food"?food():settings();
 if(!stOK)a.insertAdjacentHTML("afterbegin",'<div class="card" role="alert" style="border-color:var(--org)">Il salvataggio non è disponibile in questo browser: schede, pasti e passi andranno persi alla chiusura della pagina.</div>');
 if(window.lucide)try{lucide.createIcons()}catch(e){}
 requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".arc").forEach(x=>x.style.strokeDashoffset=x.dataset.o)));
}
function setTab(t){tab=t;view="home";dl=-1;render(true)}

function calc(){
 const p=S.prof,bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=="m"?5:-161),t=isTrain(),tdee=bmr*p.act+(t?300:0);
 const adj=p.goal=="lose"?-450:p.goal=="gain"?250:0,target=Math.round(tdee+adj);
 const pr=Math.round(p.w*(p.goal=="keep"?1.6:2)),fa=Math.round(target*.27/9),ca=Math.max(0,Math.round((target-pr*4-fa*9)/4));
 return{bmr:Math.round(bmr),tdee:Math.round(tdee),adj,target,t,pr,fa,ca};
}
function tot(){const f=S.food[td()]||[];return f.reduce((a,x)=>({k:a.k+x.k,p:a.p+(x.p||0),c:a.c+(x.c||0),f:a.f+(x.f||0)}),{k:0,p:0,c:0,f:0})}

function home(){
 const c=calc(),e=tot(),left=c.target-e.k,over=left<0;
 const pl=S.plans.slice(0,3);
 return `<div class="mute">${new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})}</div><h1>Oggi</h1>
 <span class="badge ${c.t?"bt":"br"}">${I(c.t?"flame":"moon",16)}${c.t?"Giorno di allenamento":"Giorno di riposo"}</span>
 <div class="card" style="margin-top:20px"><div class="row sp"><div><div class="mute">Calorie</div><div class="big">${Math.abs(left)}</div><div class="mute">${over?"oltre il target":"ancora disponibili"}</div><div class="mute" style="margin-top:10px">Target ${c.target} kcal<br>Mangiate ${e.k} kcal</div></div>
 ${ring(e.k/c.target,168,16,over?"var(--org)":"var(--lime)",`${I("flame",26)}<div class="mute" style="margin-top:4px">${Math.round(Math.min(e.k/c.target,9.99)*100)}%</div>`)}</div>
 </div>
 ${stepsCard()}${histCard()}<div class="card"><div class="row sp"><h3>${c.t?"Scheda di oggi":"Recupero"}</h3>${I("dumbbell",22)}</div>
 ${c.t?(pl.length?pl.map((p,i)=>`<div class="row sp" style="margin-top:14px"><span>${esc(p.name)}<br><span class="mute">${p.ex.length} esercizi</span></span><div class="row"><button class="pri" onclick="startS(${i})">${I("play",16)}Avvia</button>${dl==i?`<button style="background:var(--org);border-color:var(--org);color:#0A0C0B" onclick="delOk(${i})">Sì, elimina</button><button onclick="dl=-1;render()">Annulla</button>`:`<button onclick="delP(${i})">${I("trash-2",16)}Elimina</button>`}</div></div>`).join(""):`<p class="mute">Non hai ancora una scheda.</p><button class="pri" onclick="setTab('gym')">${I("plus",16)}Crea scheda</button>`):`<p class="mute" style="margin:10px 0 0">Oggi riposi: il target calorico è più basso. Dormi bene e bevi acqua.</p>`}</div>
 <div class="row"><button class="pri" onclick="setTab('food')">${I("plus",16)}Aggiungi pasto</button><button onclick="setTab('food')">${I("camera",16)}Foto del pasto</button></div>`;
}

function gym(){
 let h=`<h1>Allenamento</h1><p class="mute" style="margin:0">Le tue schede e quelle pronte</p><h2>Le mie schede</h2>`;
 if(!S.plans.length)h+=`<p class="mute">Nessuna scheda. Creane una con gli esercizi del trainer o parti da una pronta.</p>`;
 S.plans.forEach((p,i)=>{h+=`<div class="card plan"><div class="ico">${I("dumbbell",24)}</div><div style="flex:1"><h3>${esc(p.name)}</h3><span class="mute">${p.ex.length} esercizi${p.wu?", riscaldamento "+p.wu+" min":""}${p.cd?", defaticamento "+p.cd+" min":""}</span></div><div class="row" style="width:100%"><button class="pri" onclick="startS(${i})">${I("play",16)}Avvia</button><button onclick="cur=${i};view='edit';render(true)">${I("pencil",16)}Modifica</button>${dl==i?`<button class="pri" style="background:var(--org);border-color:var(--org);box-shadow:none" onclick="delOk(${i})">Sì, elimina</button><button onclick="dl=-1;render()">Annulla</button>`:`<button onclick="delP(${i})">${I("trash-2",16)}Elimina</button>`}</div></div>`});
 return h+`<button class="pri" onclick="S.plans.push({name:'Nuova scheda',wu:5,cd:5,ex:[{n:'',s:3,r:'10',t:60}]});save();cur=S.plans.length-1;view='edit';render(true)">${I("plus",18)}Nuova scheda personalizzata</button>
 <div class="card row sp" style="margin-top:22px"><div class="plan"><div class="ico">${I("library",24)}</div><div><h3>Libreria esercizi</h3><span class="mute">${E.length} esercizi con spiegazione</span></div></div><button class="pri" onclick="openLib('home')">${I("search",16)}Cerca</button></div>
 <h2>Schede pronte</h2><p class="mute">Toccane una per copiarla tra le tue: poi la puoi modificare.</p><div class="chips">${Object.keys(P).map(g=>`<button onclick="addPre('${g}')">${I("plus",15)}${g}</button>`).join("")}</div>`;
}
function delP(i){dl=i;render()}
function delOk(i){S.plans.splice(i,1);dl=-1;save();render()}
function addPre(g){S.plans.push({name:g,wu:5,cd:5,ex:P[g].map(e=>({n:e[0],s:e[1],r:e[2],t:e[3]}))});save();render()}
function editor(){
 const p=S.plans[cur];
 return `<h1>Modifica scheda</h1><div class="card"><label>Nome scheda<input value="${esc(p.name)}" oninput="S.plans[cur].name=this.value;save()"></label>
 <label style="margin-top:12px">Riscaldamento in minuti (0 se non serve)<input type="number" min="0" inputmode="numeric" value="${p.wu||0}" oninput="S.plans[cur].wu=+this.value||0;save()"></label></div>
 <h2 style="margin-top:22px">Esercizi (${p.ex.length})</h2>
 ${p.ex.map((e,i)=>`<div class="card"><div class="row sp"><b>Esercizio ${i+1}</b><button class="ic" aria-label="Rimuovi esercizio" onclick="S.plans[cur].ex.splice(${i},1);save();render()">${I("trash-2",16)}</button></div>
 <label style="margin-top:8px">Nome<input placeholder="Es. Panca piana" value="${esc(e.n)}" oninput="ed(${i},'n',this.value)"></label>
 <div class="row" style="margin-top:10px"><label>Serie<input type="number" min="1" value="${e.s}" oninput="ed(${i},'s',this.value)"></label><label>Ripetizioni<input value="${esc(e.r)}" oninput="ed(${i},'r',this.value)"></label><label>Recupero (s)<input type="number" min="0" value="${e.t}" oninput="ed(${i},'t',this.value)"></label><label>Peso (kg)<input type="number" min="0" step="0.5" inputmode="decimal" value="${e.kg||0}" oninput="ed(${i},'kg',this.value)"></label></div></div>`).join("")}
 <div class="row" style="margin-bottom:6px"><button onclick="S.plans[cur].ex.push({n:'',s:3,r:'10',t:60});save();render()">${I("plus",16)}Aggiungi esercizio</button><button onclick="openLib('edit')">${I("search",16)}Dalla libreria</button></div>
 <div class="card"><label>Defaticamento in minuti, a fine allenamento (0 se non serve)<input type="number" min="0" inputmode="numeric" value="${p.cd||0}" oninput="S.plans[cur].cd=+this.value||0;save()"></label></div>
 <div class="row"><button class="pri" onclick="view='home';render(true)">${I("check",16)}Salva scheda</button></div>`;
}
function ed(i,f,v){S.plans[cur].ex[i][f]=(f=="s"||f=="t"||f=="kg")?(+v||0):v;save()}
function startS(i){cur=i;sd={};lk="";t0=Date.now();S.sess={cur:i,sd:sd,t0:t0};save();tab="gym";view="session";render(true)}
function session(){
 const p=S.plans[cur],n=p.ex.reduce((a,e)=>a+e.s,0),d=Object.keys(sd).filter(k=>k!="wu"&&k!="cd"&&sd[k]).length;
 const cd=p.cd>0?`<div class="card row sp"><div class="plan"><div class="ico" style="background:rgba(89,200,255,.15);color:var(--sky)">${I("wind",24)}</div><div><h3>Defaticamento</h3><span class="mute">${p.cd} minuti</span></div></div><div class="row"><button class="pri" onclick="tStart(${p.cd*60},'Defaticamento')">${I("timer",16)}Avvia</button><button class="${sd.cd?"on":""}" onclick="sd.cd=!sd.cd;save();render()">${sd.cd?"Fatto":"Segna fatto"}</button></div></div>`:"";
 const wu=p.wu>0?`<div class="card row sp"><div class="plan"><div class="ico" style="background:rgba(255,106,31,.16);color:var(--org)">${I("flame",24)}</div><div><h3>Riscaldamento</h3><span class="mute">${p.wu} minuti</span></div></div><div class="row"><button class="pri" onclick="tStart(${p.wu*60},'Riscaldamento')">${I("timer",16)}Avvia</button><button class="ic ${sd.wu?"on":""}" aria-label="Segna come fatto" onclick="sd.wu=!sd.wu;save();render()">${I("check",18)}</button></div></div>`:"";
 return `<div class="row sp"><h1>${esc(p.name)}</h1><div class="row"><button onclick="tStop();view='edit';render(true)">${I("pencil",16)}Modifica</button><button onclick="finish()">${I("flag",16)}Termina</button></div></div>
 <div class="card row" style="gap:18px">${ring(n?d/n:0,70,8,"var(--lime)",`<b>${d}/${n}</b>`)}<div><b>Serie completate</b><div class="mute">Tocca una serie quando l’hai finita: parte il recupero.</div></div></div>`+wu+
 p.ex.map((e,i)=>`<div class="card ex"><h3>${esc(e.n||"Esercizio")}</h3><span class="mute">${e.s} serie × ${esc(e.r)}, recupero ${e.t} s</span><div class="row sp" style="margin-top:12px"><b>${e.kg>0?e.kg+" kg":"Corpo libero"}</b><span class="row" style="gap:8px"><button onclick="kgAdj(${i},-2.5)">−2,5 kg</button><button onclick="kgAdj(${i},2.5)">+2,5 kg</button></span></div>
 <div class="sets">${Array.from({length:e.s},(_,j)=>{const k=i+"-"+j;return `<button class="${sd[k]?"d":""} ${lk==k?"pop":""}" aria-label="Serie ${j+1}" onclick="setDone(${i},${j})">${sd[k]?I("check",22):j+1}</button>`}).join("")}</div>
 <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n+" esecuzione corretta")}" target="_blank" rel="noopener">${I("circle-play",18)}Guarda come si esegue</a></div>`).join("")+cd;
}
function finish(){tStop();const p=S.plans[cur],n=p.ex.reduce((a,e)=>a+e.s,0),d=Object.keys(sd).filter(k=>k!="wu"&&k!="cd"&&sd[k]).length,m=Math.min(180,Math.max(1,Math.round((Date.now()-t0)/60000)));res={n,d,m,k:Math.round(5*S.prof.w*m/60),name:p.name};S.hist.push({d:td(),name:p.name,k:res.k,m,n,done:d});S.sess=null;save();view="done";render(true)}
function summary(){
 const r=res;
 return `<h1>Allenamento completato</h1><p class="mute" style="margin:0">${esc(r.name)}</p>
 <div class="card" style="text-align:center"><div style="display:flex;justify-content:center">${ring(r.k/300,190,18,"var(--org)",`${I("flame",28)}<div class="big" style="font-size:40px">${r.k}</div><div class="mute">kcal stimate</div>`)}</div>

function fcalc(){const x=FOODS[fsel];if(!x)return "";const m=fg/100;return Math.round(x.k*m)+" kcal, carboidrati "+r1(x.h*m)+" g, proteine "+r1(x.p*m)+" g, grassi "+r1(x.f*m)+" g"}

function dinner(){
 const c=calc(),e=tot(),r={k:c.target-e.k,p:Math.max(0,c.pr-e.p),c:Math.max(0,c.ca-e.c),f:Math.max(0,c.fa-e.f)};
 if(r.k<=0)return `<p class="mute">Hai già raggiunto il target di oggi. Se hai ancora fame scegli verdure e proteine magre.</p>`;
 const v=[r.p,r.c,r.f],nv=Math.hypot(...v)||1;
 const pick=(m,n,lim)=>{const s=ID.filter(x=>x[5]==(c.t?"on":"off")&&x[6]==m).map(x=>({x,s:(x[2]*v[0]+x[3]*v[1]+x[4]*v[2])/(Math.hypot(x[2],x[3],x[4])*nv)}));let o=s.filter(y=>y.x[1]<=lim).sort((a,b)=>b.s-a.s);if(!o.length)o=s.sort((a,b)=>a.x[1]-b.x[1]);return o.slice(0,n).map(y=>y.x)};
 const row=x=>`<div class="food"><div style="flex:1">${esc(x[0])}<br><span class="mute">circa ${x[1]} kcal, P ${x[2]} g, C ${x[3]} g, G ${x[4]} g</span></div></div>`;
 const blk=(t,L)=>`<div class="mute" style="margin-top:12px;font-weight:600">${t}</div>${L.map(row).join("")}`;
 return `<p class="mute" style="margin:0">Ti restano ${r.k} kcal: proteine ${Math.round(r.p)} g, carboidrati ${Math.round(r.c)} g, grassi ${Math.round(r.f)} g. ${c.t?"Giorno di allenamento: idee più ricche di carboidrati complessi per il recupero.":"Giorno di riposo: idee leggere, ricche di proteine, fibre e grassi buoni, con carboidrati moderati."}</p>`+(c.t?blk("Cena",pick("c",3,r.k+100)):blk("Pranzo",pick("p",2,r.k*.6+100))+blk("Cena",pick("c",2,r.k+100)))+`<p class="mute" style="margin:12px 0 0">Porzioni indicative: adattale alle calorie che ti restano.</p>`;
}

function analyze(inp){const f=inp.files[0];inp.value="";if(f)ask("Guarda la foto di un pasto ed elenca ogni alimento o bevanda visibile con una stima realistica di porzione e calorie. "+FMT+" Se nella foto non c’è cibo rispondi con [].",f)}
async function ask(prompt,img){
 pend=[];pmsg=img?"Sto analizzando la foto…":"Sto calcolando le calorie…";render();
 try{
  const sample=await claude.use("sample");
  if(!sample){pmsg="Il calcolo automatico non è disponibile qui.";render();return}
  const o={cache:false};
  if(img){const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images){pmsg="L’analisi delle foto non è disponibile qui.";render();return}o.images=[img]}
  const r=await sample.json(prompt,o);
  pend=(Array.isArray(r)?r:[]).filter(x=>x&&x.n&&+x.k>0).map(x=>({n:String(x.n),q:String(x.q||""),k:Math.round(+x.k)}));
  pmsg=pend.length?"":"Non sono riuscito a stimare le calorie. Prova a descrivere meglio il pasto o a fare una foto.";
 }catch(e){
  const c=e&&e.code;
  pmsg=c=="not_granted"?"Per calcolare le calorie devi consentire l’uso di Claude quando te lo chiede.":c=="rate_limited"?"Troppe richieste in poco tempo. Riprova tra poco.":c=="image_rejected"?"Foto non valida. Provane un’altra.":c=="cancelled"?"":"Calcolo non riuscito. Riprova tra poco.";
 }
 render();
}

 <h2>Obiettivo passi</h2><div class="card"><label>Passi al giorno<input type="number" inputmode="numeric" value="${S.sgoal||10000}" onchange="S.sgoal=+this.value||10000;save();render()"></label></div>
 <h2>Giorni di allenamento</h2><div class="card"><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button class="${S.days.includes(d)?"on":""}" onclick="togDay(${d})">${D[d]}</button>`).join("")}</div>
 <div class="row sp" style="margin-top:16px"><span class="mute">Oggi: ${isTrain()?"allenamento":"riposo"}</span><button onclick="S.ov[td()]=!isTrain();save();render()">${I("repeat",16)}Cambia solo oggi</button></div></div>
 <p class="mute">Metabolismo basale ${c.bmr} kcal (Mifflin-St Jeor). Nei giorni di allenamento si aggiungono 300 kcal; obiettivo: ${c.adj>0?"+":""}${c.adj} kcal. Le stime non sostituiscono un nutrizionista.</p>`;
}
function stepsCard(){
 const n=(S.steps||{})[td()]||0,g=S.sgoal||10000,kc=Math.round(n*.04*S.prof.w/70);
 return `<div class="card"><div class="row sp"><h3>Passi</h3>${I("footprints",22)}</div><div class="row" style="gap:18px;margin-top:12px">${ring(n/g,96,10,"var(--sky)",`<b>${Math.round(Math.min(n/g,9.99)*100)}%</b>`)}<div style="flex:1"><div class="big" style="font-size:34px">${n.toLocaleString("it-IT")}</div><div class="mute">su ${g.toLocaleString("it-IT")}, circa ${kc} kcal bruciate</div></div></div>
 <div class="row" style="margin-top:14px;align-items:flex-end"><label>Passi di oggi (dal tuo Huawei Health)<input id="sn" type="number" inputmode="numeric" placeholder="Es. 6500"></label><button class="pri" onclick="setSteps()">${I("check",16)}Salva</button></div></div>`;
}
function setSteps(){const v=$("sn").value;if(v===""||!(+v>=0))return;(S.steps=S.steps||{})[td()]=Math.round(+v);save();render()}
function histCard(){
 const rows=[];for(let i=0;i<7;i++){const dt=new Date();dt.setDate(dt.getDate()-i);const k=dt.toLocaleDateString("sv"),f=(S.food[k]||[]).reduce((a,x)=>a+x.k,0),st=S.steps[k]||0,w=S.hist.filter(h=>h.d==k).reduce((a,h)=>a+h.k,0);
  if(f||st||w)rows.push(`<div class="food"><b style="min-width:64px">${i?dt.toLocaleDateString("it-IT",{weekday:"short",day:"numeric"}):"Oggi"}</b><span class="mute" style="flex:1;text-align:right">${st.toLocaleString("it-IT")} passi, ${f} kcal mangiate${w?", "+w+" kcal allenamento":""}</span></div>`)}
 return rows.length?`<div class="card" style="padding-top:8px;padding-bottom:8px"><h3 style="margin:12px 0 4px">Ultimi 7 giorni</h3>${rows.join("")}</div>`:"";
}
function togDay(d){const i=S.days.indexOf(d);i<0?S.days.push(d):S.days.splice(i,1);save();render()}
render(true);
</script></body></html>
